name: Monika

options:
  bundleIdPrefix: com.blq
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_LANGUAGE: fr

targets:
  Monika:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Monika
        excludes:
          - Assets.xcassets
          - Info.plist
      - path: Monika/Assets.xcassets
    info:
      path: Monika/Info.plist
      properties:
        CFBundleDevelopmentRegion: fr
        CFBundleDisplayName: Monika
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: "Monika accède à ta photothèque uniquement lorsque tu choisis d'envoyer une photo dans la conversation."
        NSMicrophoneUsageDescription: "Monika utilise le microphone pour transcrire ta voix en message lorsque tu actives la dictée."
        NSSpeechRecognitionUsageDescription: "Monika utilise la reconnaissance vocale d'iOS pour convertir ta voix en texte dans le champ de saisie."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
            "100.66.0.111":
              NSExceptionAllowsInsecureHTTPLoads: true
            "100.64.0.0/10":
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_NAME: Monika
        PRODUCT_BUNDLE_IDENTIFIER: com.blq.monika
        MARKETING_VERSION: "0.7.0"
        CURRENT_PROJECT_VERSION: "7"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES

schemes:
  Monika:
    build:
      targets:
        Monika: all
    run:
      config: Debug
    archive:
      config: Release
