name: Build Monika

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Monika IPA
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # a) Sélection de Xcode 26
      - name: Sélectionner Xcode 26
        id: xcode
        run: |
          echo "Xcode installés sur le runner :"
          ls -d /Applications/Xcode*.app || true
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -n 1 || true)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          if [ -z "$XCODE" ]; then
            XCODE=/Applications/Xcode.app
          fi
          echo "➡️  Sélection de $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          XCODE_VER=$(xcodebuild -version | tr '\n' '-' | tr ' ' '_')
          echo "version=$XCODE_VER" >> "$GITHUB_OUTPUT"
          xcodebuild -version | head -n 1 | grep -q "Xcode 26" || { echo "❌ Xcode 26 introuvable"; exit 1; }

      # b) Génération du projet avec XcodeGen
      - name: Installer XcodeGen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Générer Monika.xcodeproj
        run: xcodegen generate

      # c) Cache DerivedData (modules et objets intermédiaires)
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: |
            DerivedData/ModuleCache.noindex
            DerivedData/Build/Intermediates.noindex
          key: deriveddata-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Monika/**') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-${{ steps.xcode.outputs.version }}-

      # d) Compilation non signée pour iPhone + IPA
      - name: Compiler pour iPhone (non signé)
        run: |
          set -o pipefail
          xcodebuild \
            -project Monika.xcodeproj \
            -scheme Monika \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild-device.log | (grep -E "error:|warning:|BUILD" || true)
          test -d DerivedData/Build/Products/Release-iphoneos/Monika.app

      - name: Créer Monika.ipa
        run: |
          rm -rf Payload Monika.ipa
          mkdir Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/Monika.app Payload/
          zip -qry Monika.ipa Payload
          ls -lh Monika.ipa

      # e) Publication des artefacts
      - name: Publier Monika.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Monika-ipa
          path: Monika.ipa
          if-no-files-found: error

      - name: Publier les logs de compilation (échec uniquement)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: xcodebuild-*.log
          if-no-files-found: ignore
